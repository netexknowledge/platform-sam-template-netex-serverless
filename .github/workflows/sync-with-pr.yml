name: "sync-with-pr"

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [semantic-release-main]

permissions: write-all

jobs:
  sync-with-pr:
    uses: netexknowledge/.github/.github/workflows/sync-with-pr-reusable.yml@sync-with-pr-reusable#v1
    # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit -- necesario: el token de GitHub App del equipo se resuelve en runtime por nombre dinamico (secrets[env.APP_ID_NAME]), no se puede declarar como secreto individual
    secrets: inherit
